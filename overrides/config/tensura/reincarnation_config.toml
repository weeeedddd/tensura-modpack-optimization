# ═══════════════════════════════════════════════════════════════════════════
#  TENSURA ABYSS — Reincarnation menu configuration
#
#  This file controls which races appear in Tensura's native selection
#  (reincarnation) menu. The pack ships it because the four Abyss starter
#  races are custom (registered by the tensura_abyss companion mod) and are
#  NOT part of Tensura's defaults — without this file they never show up in
#  the menu.
#
#  Vanilla default lists were extracted 1:1 from tensura-reincarnated
#  (1.21.1, file 7905367) and kept intact; only the tensura_abyss starters
#  were appended. Higher Abyss forms (Abyss Slime and beyond) are reached
#  through the in-menu EVOLUTION system, not selected at spawn.
# ═══════════════════════════════════════════════════════════════════════════

[Races]
	# Races offered when choosing a starting race
	startingRaces = [
		"tensura:human", "tensura:elf", "tensura:dwarf", "tensura:merfolk",
		"tensura:beastfolk", "tensura:harpy", "tensura:goblin", "tensura:lizardman",
		"tensura:ogre", "tensura:orc", "tensura:slime", "tensura:wight",
		"tensura:ghoul", "tensura:lesser_daemon", "tensura:giant",
		"tensura_abyss:shadow_slime", "tensura_abyss:low_shadow_demon",
		"tensura_abyss:human_apprentice", "tensura_abyss:vampire_spawn"
	]
	# Pool used for the "random race" option
	randomRaces = [
		"tensura:human", "tensura:elf", "tensura:dwarf", "tensura:merfolk",
		"tensura:beastfolk", "tensura:harpy", "tensura:goblin", "tensura:lizardman",
		"tensura:ogre", "tensura:orc", "tensura:slime", "tensura:wight",
		"tensura:ghoul", "tensura:lesser_daemon", "tensura:giant",
		"tensura_abyss:shadow_slime", "tensura_abyss:low_shadow_demon",
		"tensura_abyss:human_apprentice", "tensura_abyss:vampire_spawn"
	]
	# Races offered on reincarnation (vanilla defaults)
	reincarnationRaces = [
		"tensura:human", "tensura:elf", "tensura:dwarf", "tensura:merfolk",
		"tensura:beastfolk", "tensura:harpy", "tensura:goblin", "tensura:lizardman",
		"tensura:orc", "tensura:slime", "tensura:wight", "tensura:ghoul"
	]
	# Races offered on mastered reincarnation (vanilla defaults)
	reincarnationRacesMastered = [
		"tensura:human", "tensura:elf", "tensura:dwarf", "tensura:merfolk",
		"tensura:beastfolk", "tensura:harpy", "tensura:hobgoblin", "tensura:dragonewt",
		"tensura:ogre", "tensura:high_orc", "tensura:slime", "tensura:wight",
		"tensura:vampire", "tensura:lesser_daemon", "tensura:giant"
	]

