# ═══════════════════════════════════════════════════════════════════════════
#  Tensura Abyss — Custom-Rassen fuer Tensura: Ascension (ascension-2.1.2)
#  ZIEL-PFAD IN DER INSTANZ:  config/tensura/ascension-races.toml
# ═══════════════════════════════════════════════════════════════════════════
#
#  >>> WICHTIG: Die exakten Schluessel-Namen (spiritualHealth, movementSpeed, …)
#      und die TOML-Struktur MUESSEN gegen die installierte Tensura-Ascensions-
#      Version abgeglichen werden. Diese Datei ist als vollstaendige, konsistente
#      Vorlage geschrieben; passe die Keys an das reale Schema an, falls sie
#      abweichen (siehe die vom Mod generierte Beispiel-Config im config-Ordner).
#
#  ARCHITEKTUR:
#   - Diese Datei definiert die Rassen -> sie erscheinen im ORIGINALEN
#     Tensura-Rassenauswahl-/Evolutionsmenue (via Ascension-Addon).
#   - evolutionRequirementEP ist das native EP-Gate im Menue.
#   - Harte Zusatz-Gates (Boss-Kill, Dimension, Items, Coins) prueft
#     kubejs/server_scripts/shadow_race_trees.js im Hintergrund.
#   - Die versteckte Rasse (Stylish Bandit Slayer) wird NUR per Skript
#     vergeben: kubejs/server_scripts/secret_bandit_slayer.js.
#
#  4 sichtbare Pfade x 9 Stufen + 1 versteckte Rasse + Legacy-Block.
# ═══════════════════════════════════════════════════════════════════════════

