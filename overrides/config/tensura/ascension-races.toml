# Banditen-Dorf saeubern -> Ohnmachts-Event -> permanente Verwandlung.
#
# >>> Der Key "hidden" ist eine ANNAHME — verifiziere gegen die
#     Ascensions-Beispiel-Config, wie Rassen aus dem Menue versteckt werden
#     (alternativ: isStartRace=false + kein previousRace laesst die Rasse in
#     der Praxis unerreichbar fuer das Menue, da sie in keinem Baum haengt).
# ─────────────────────────────────────────────────────────────────────────────

