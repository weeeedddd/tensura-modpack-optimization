# ═══════════════════════════════════════════════════════════════════════════
#  Tensura Abyss — Shadow-Garden Rassen fuer Tensura Ascensions
#  ZIEL-PFAD IN DER INSTANZ:  config/tensura/ascension-races.toml
# ═══════════════════════════════════════════════════════════════════════════
#
#  >>> WICHTIG: Die exakten Schluessel-Namen (spiritualHealth, movementSpeed, …)
#      und die TOML-Struktur MUESSEN gegen die installierte Tensura-Ascensions-
#      Version abgeglichen werden. Diese Datei ist als vollstaendige, konsistente
#      Vorlage geschrieben; passe die Keys an das reale Schema an, falls sie
#      abweichen (siehe die vom Mod generierte Beispiel-Config im config-Ordner).
#
#  Progression:  Possessed -> Shadow Garden Member -> Seven Shadows (Delta/
#                Gamma/Beta/Alpha) -> Shadow (Ultimativ).
#  Die Evolution wird ueber die Companion-Mod (TensuraBridge.setTensuraRace)
#  bzw. shadow_evos.js ausgeloest; hier stehen die Rassen-STATS.
# ═══════════════════════════════════════════════════════════════════════════

[[race]]
  id = "tensura_abyss:possessed"
  name = "Possessed"
  # Startklasse: bewusst geschwaechte Werte (der "Befallene" Zustand).
  spiritualHealth = 40.0
  physicalHealth = 30.0
  movementSpeed = 0.09
  attackDamage = 2.0
  aura = 20.0
  isStartRace = false           # via Ritual/Heilung erreichbar, nicht Vanilla-Start
  evolutionRequirementEP = 0

[[race]]
  id = "tensura_abyss:shadow_garden_member"
  name = "Shadow Garden Member"
  # Gebuffte Standard-Werte nach dem Beitritt.
  spiritualHealth = 120.0
  physicalHealth = 100.0
  movementSpeed = 0.12
  attackDamage = 6.0
  aura = 150.0
  previousRace = "tensura_abyss:possessed"
  evolutionRequirementEP = 5000

