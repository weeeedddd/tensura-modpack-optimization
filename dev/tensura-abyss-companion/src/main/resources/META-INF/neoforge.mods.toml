modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
Tensura Abyss Companion — registriert die Shadow-Garden-Custom-Rassen nativ im
Evolutionssystem von Tensura: Reincarnated (erkannt von Tensura: Ascension).
Bruecke fuer das Tensura-Abyss-Modpack (Weg B).
'''

# ── Abhaengigkeiten ──
[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Tensura: Reincarnated MUSS vor uns laden (wir registrieren in seine Race-Registry).
[[dependencies.${mod_id}]]
    modId = "tensura"
    type = "required"
    versionRange = "[1.0,)"
    ordering = "BEFORE"
    side = "BOTH"

# Nightmare's Tensura Utils MUSS vor uns laden (Helper-/API-Klassen).
[[dependencies.${mod_id}]]
    modId = "nightmarestensurautils"
    type = "required"
    versionRange = "[0.1,)"
    ordering = "BEFORE"
    side = "BOTH"
