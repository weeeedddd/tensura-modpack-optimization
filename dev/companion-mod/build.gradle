plugins {
    id 'java'
    id 'net.neoforged.moddev' version '1.0.21'
}

version = project.mod_version
group = project.mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings
        minecraftVersion = project.parchment_minecraft
    }

    runs {
        client { client() }
        server { server() }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    // CurseMaven — falls du die Tensura-Mods als compileOnly-Abhaengigkeit
    // einbinden willst (die Bridge nutzt jedoch Reflection, daher optional):
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}

dependencies {
    // Reflection-Bridge -> KEINE feste Compile-Abhaengigkeit noetig.
    // Optional (fuer direkte Imports statt Reflection): die passenden
    // curse.maven-Koordinaten von Tensura Reincarnated / Ascensions eintragen:
    // compileOnly "curse.maven:tensura-reincarnated-XXXXXX:FILEID"
    // compileOnly "curse.maven:tensura-ascensions-1505110:8060740"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
