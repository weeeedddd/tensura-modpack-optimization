plugins {
    id 'java'
    id 'net.neoforged.moddev' version '1.0.21'
}

version = project.mod_version
group = project.mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings
        minecraftVersion = project.parchment_minecraft
    }

    runs {
        client { client() }
        server { server() }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    // CurseMaven: liefert die exakt im Pack installierten Mod-Jars fuer den
    // Compile gegen die echte Tensura-/ManasCore-API (Race-Registrierung).
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}

// Eigene Configuration nur zum Extrahieren der in ManasCore verschachtelten
// (Jar-in-Jar) Module — deren Klassen (ManasRace, RaceAPI, ManasSkill, ...)
// liegen NICHT in der aeusseren Jar und sind sonst beim Compile unsichtbar.
configurations {
    manascoreJij
}

dependencies {
    // ── Compile gegen die echte Tensura-API (AbyssRaces braucht die Race-Klasse) ──
    // NeoForge 1.21.1 nutzt offizielle Mappings -> Produktions-Jars sind direkt
    // kompilierbar (kein deobf noetig). ManasCore ist Tensuras Basis-Lib.
    implementation "curse.maven:architectury-api-${architectury_project_id}:${architectury_file_id}"
    implementation "curse.maven:manascore-${manascore_project_id}:${manascore_file_id}"
    implementation "curse.maven:tensura-reincarnated-${tensura_project_id}:${tensura_file_id}"
    implementation "curse.maven:nightmares-tensura-utils-${nightmareutils_project_id}:${nightmareutils_file_id}"

    // ManasCore-Jar auch zum Extrahieren der JiJ-Module bereitstellen.
    manascoreJij "curse.maven:manascore-${manascore_project_id}:${manascore_file_id}"

    // Die extrahierten JiJ-Module auf den Compile-Classpath legen (nur Compile;
    // zur Laufzeit liefert der Pack die echte ManasCore-Jar).
    compileOnly fileTree(dir: layout.buildDirectory.dir('manascore-jij'), include: '*.jar')

    // Alternativ via JitPack (Gruppe com.github.manasmods):
    //   maven { url = 'https://jitpack.io' }
    //   implementation "com.github.manasmods:tensura:<version>"
    //   implementation "com.github.manasmods:ManasCore:<version>"
}

// Extrahiert alle in der ManasCore-Jar verschachtelten Module flach nach
// build/manascore-jij/ (manascore-race, -skill, -network, ...).
def extractManascoreJij = tasks.register('extractManascoreJij', Copy) {
    from { configurations.manascoreJij.collect { zipTree(it) } }
    include 'META-INF/jars/*.jar'
    eachFile { fcd -> fcd.relativePath = new RelativePath(true, fcd.name) }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('manascore-jij')
}

tasks.named('compileJava') {
    dependsOn extractManascoreJij
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
